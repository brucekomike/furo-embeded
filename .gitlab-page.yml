# GitLab Pages deploy for the Sphinx build in .gitlab-ci.yml.
#
# Off by default: .gitlab-ci.yml includes this file only when the CI/CD variable
# PAGES_DEPLOY is "true" (Settings > CI/CD > Variables). A fresh clone of the
# template therefore has no Pages job at all until you opt in, which is what you
# want because the URL prefix and read access are per-project settings
# (Settings > Pages), not pipeline settings.
#
# Requires GitLab >= 17.10: `pages:publish` names the source directory and
# GitLab appends it to the upstream artifacts:paths automatically. On older
# versions the legacy `pages` job expects a `public/` directory in artifacts.

pages_site:
  stage: deploy
  tags:
    - ubuntu 24.04
    - shared
  needs:
    - job: build_docs
      artifacts: true
  script:
    # Pages refuses to deploy a bundle with no index.html at the publish root;
    # fail the job loudly instead of shipping an empty site.
    - test -s html-docs/index.html
  pages:
    publish: html-docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
