# tested in selfhosted gitlab runner (ubuntu 24.04 LXC in PVE)
# apt update && apt upgrade
# apt install build-essential python3-venv
#
# Pages is opt-in: set the CI/CD variable PAGES_DEPLOY to "true" to pull
# .gitlab-page.yml into the pipeline. Note that this switch must be a
# project/group/instance variable — include rules are evaluated before jobs, so
# a `variables:` block in this file cannot reach them.
stages:
  - build
  - deploy

include:
  - local: '.gitlab-page.yml'
    rules:
      - if: $PAGES_DEPLOY == "true"

build_docs:
  stage: build
  tags:
    - ubuntu 24.04
    - shared
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -r docs/requirements.txt
  script:
    - cd docs
    - make html
    - mv build/html ../html-docs
  artifacts:
    paths:
      - html-docs
    expire_in: 1 week

